<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..750&display=swap">
<style>
html,body{margin:0;height:288px;width:960px;background:var(--md-sys-color-surface);overflow:hidden}
.wrap{position:relative;width:960px;height:288px}
svg{position:absolute;left:0;top:0}
.b-primary{fill:var(--md-sys-color-primary)}
.b-pc{fill:var(--md-sys-color-primary-container)}
.b-tc{fill:var(--md-sys-color-tertiary-container)}
.b-sc{fill:var(--md-sys-color-secondary-container)}
.b-ink{fill:var(--md-sys-color-inverse-surface)}
.p-on{fill:var(--md-sys-color-on-primary)}
.p-pc{fill:var(--md-sys-color-primary-container)}
.t{position:absolute;left:40px;bottom:36px;max-width:440px}
.name{font-family:"Roboto Flex",system-ui,sans-serif;font-size:64px;line-height:.95;font-weight:650;color:var(--md-sys-color-on-surface);margin:0;letter-spacing:-.5px}
.tag{font-family:"Roboto Flex",system-ui,sans-serif;font-size:14px;line-height:20px;color:var(--md-sys-color-on-surface-variant);margin-top:12px}
</style></head><body><div class="wrap">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
blocks: primary 224x288 (radius large 16 on free corners), primary-container 160x136, tertiary-container 160x136, secondary-container 96x96 disc, inverse-surface 96x40 pill
arrangement: one tall slab bleeding off top and bottom with satellites stacked on a 16px (app-space-4) gutter
pattern: M3 Expressive shape scale ("formas expresivas, esquinas completas"), discs and pills cut at md-sys-shape-corner-full, a 4 x 3 dot grid on the slab at 32px pitch (app-space-8)
steps and radii: gaps 16 (app-space-4), pitch 32 (app-space-8), corners 16 (corner-large), 28 (corner-extra-large), full
-->
<rect class="b-pc" x="496" y="16" width="160" height="136" rx="28"/>
<rect class="b-tc" x="496" y="168" width="160" height="104" rx="16"/>
<rect class="b-primary" x="672" y="-16" width="224" height="320" rx="28"/>
<circle class="b-sc" cx="928" cy="80" r="48"/>
<rect class="b-ink" x="880" y="208" width="96" height="40" rx="20"/>
<g class="p-on">
<circle cx="720" cy="48" r="6"/><circle cx="752" cy="48" r="6"/><circle cx="784" cy="48" r="6"/><circle cx="816" cy="48" r="6"/>
<circle cx="720" cy="80" r="6"/><circle cx="752" cy="80" r="6"/><circle cx="784" cy="80" r="6"/><circle cx="816" cy="80" r="6"/>
<circle cx="720" cy="112" r="6"/><circle cx="752" cy="112" r="6"/><circle cx="784" cy="112" r="6"/><circle cx="816" cy="112" r="6"/>
</g>
<rect class="p-pc" x="704" y="184" width="128" height="40" rx="20"/>
<rect class="p-pc" x="704" y="232" width="80" height="40" rx="20" opacity=".6"/>
<circle class="b-primary" cx="576" cy="84" r="32"/>
</svg>
<div class="t"><p class="name">Taller - IA</p><p class="tag">Entorno de aprendizaje académico y profesional, con Material 3 Expressive.</p></div>
</div></body></html>
